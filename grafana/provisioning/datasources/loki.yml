apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    uid: loki
    # Nombre del servicio en docker-compose, NO localhost:
    # Grafana resuelve dentro de la red de compose.
    url: http://loki:3100
    isDefault: true
    editable: true
    jsonData:
      # Sin multi-tenancy (auth_enabled: false) no se manda X-Scope-OrgID
      maxLines: 5000
      timeout: 300
